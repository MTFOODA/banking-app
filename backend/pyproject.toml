[project]
name = "faisal-app-backend"
version = "1.0.0"
description = "Faisal App demo banking backend (FastAPI + SQLAlchemy + PostgreSQL)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
