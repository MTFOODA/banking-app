name: faisal_app
description: "Banking App - fictional multi-bank mobile and web experience."
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^16.2.4
  get_it: ^8.2.0
  dio: ^5.9.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  file_picker: ^13.2.0
  local_auth: 3.0.2
  url_launcher: ^6.3.3
  flutter_svg: 2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
  assets:
    - assets/branding/
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/data/bank_directories/
    - assets/banks/
